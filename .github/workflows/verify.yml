name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ALLOW_MEMORY_DB: "1"
      DB_PERSIST: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: node scripts/check-repository.mjs
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
